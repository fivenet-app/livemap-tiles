name: Lint Commit Messages
on:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove tsconfig.json
        run: rm -f tsconfig.json

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: "./.commitlintrc.json"
